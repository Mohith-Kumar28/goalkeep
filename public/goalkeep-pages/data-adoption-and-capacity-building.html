<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data adoption and capacity-building | Goalkeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&amp;display=swap">
<style>
body{margin:0;background:#FCFCFD}
a{color:#2F4D9F}a:hover{color:#1E3266}
.gk *{box-sizing:border-box}
.gk em{font-style:italic;font-weight:800}
.shell{max-width:1320px;margin:0 auto;padding-left:64px;padding-right:64px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#2F4D9F;margin:0 0 16px}
.eyebrow::before{content:"";width:24px;height:2px;background:currentColor;display:block}
.on-navy .eyebrow{color:#EAC452}
.eyebrow.gold-ink{color:#7D5E0C}
.h2{font-size:42px;font-weight:400;line-height:1.16;letter-spacing:-0.02em;margin:0;text-wrap:balance;max-width:24ch}
.h3{font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-0.015em;margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:15px;font-weight:700;padding:11px 20px;border-radius:4px;text-decoration:none;border:1px solid transparent;min-height:44px;cursor:pointer;transition:background-color 240ms cubic-bezier(0.22,1,0.36,1),border-color 240ms,color 240ms}
.btn svg{transition:transform 240ms cubic-bezier(0.22,1,0.36,1)}
.btn:hover svg{transform:translateX(3px)}
.btn-accent{background:#EAC452;color:#1E3266}.btn-accent:hover{background:#CFA72F;color:#1E3266}
.on-navy .btn-accent:hover{background:#FFFFFF}
.btn-sec-navy{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,0.6)}.btn-sec-navy:hover{color:#FFFFFF;border-color:#FFFFFF}
.btn-primary{background:#2F4A92;color:#FFFFFF}.btn-primary:hover{background:#1E3266;color:#FFFFFF}
.tlink{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#2F4D9F;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px;transition:gap 140ms}
.tlink:hover{gap:12px;color:#1E3266}
.nav-item{position:relative}
.nav-link{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.86);text-decoration:none;font-size:15px;font-weight:600;padding:12px 0;min-height:44px}
.nav-link:hover,.nav-link.is-active{color:#FFFFFF}
.nav-link.is-active{box-shadow:inset 0 -2px 0 #EAC452}
.dd{display:none;position:absolute;top:100%;left:-24px;width:400px;background:#FFFFFF;border:1px solid #E5E7EE;border-radius:12px;box-shadow:0 16px 40px rgba(20,19,26,0.18);padding:8px;z-index:30}
.nav-item:hover .dd,.nav-item:focus-within .dd{display:block}
.dd a{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:8px;text-decoration:none;color:#14131A}
.dd a:hover{background:#F1F4FA;color:#14131A}
.dd .sw{width:10px;height:10px;border-radius:2px;margin-top:6px;flex:none}
.dd .t{font-size:15px;font-weight:700;display:block}
.dd .d{font-size:13px;color:rgba(20,19,26,0.72);display:block;margin-top:2px;line-height:1.45}
.surface{background:#FFFFFF;border:1px solid #E5E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(20,19,26,0.06)}
.lift{transition:transform 240ms cubic-bezier(0.22,1,0.36,1),box-shadow 240ms,border-color 240ms}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,19,26,0.12);border-color:#D3D7E2}
.marker{background:linear-gradient(100deg,#F7DB63 0%,#FCF0A5 5%,#FCF0A5 95%,#F7DB63 100%);padding:0 5px;margin:0 -2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:2px}
.note{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;padding:22px 22px 20px;font-family:inherit;font-size:16px;line-height:1.5;color:#14131A;cursor:pointer;border:none;transition:transform 320ms cubic-bezier(0.22,1,0.36,1),box-shadow 320ms,background-color 320ms}
.note:hover{box-shadow:0 18px 36px rgba(125,94,12,0.22) !important}
.note:focus-visible{outline:3px solid #3F63C8;outline-offset:3px}
.deliv{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font-family:inherit;font-size:17px;line-height:1.45;color:#14131A;padding:16px 18px;border:none;border-radius:10px;cursor:pointer;transition:background-color 240ms}
.deliv:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
.sign{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:28px 30px 30px;background:transparent;border:none;font-family:inherit;font-size:19px;line-height:1.5;color:#14131A;cursor:pointer;border-radius:12px;transition:background-color 240ms}
.sign:hover{background:#FBF3DF}
.sign:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
.sign .loop{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);pointer-events:none;overflow:visible}
.field{font-family:inherit;font-size:17px;font-weight:400;padding:11px 14px;border:1px solid #D3D7E2;border-radius:8px;color:#14131A;background:#FFFFFF;min-height:44px}
.field:focus{outline:3px solid rgba(63,99,200,0.35);border-color:#3F63C8}
.slide-in{animation:slidein 420ms cubic-bezier(0.22,1,0.36,1)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide-in{animation:none}}
.ban-blue{background:#2F4D9F !important}
.ban-teal{background:#237A70 !important}
.ban-coral{background:#C8613F !important}
.ban-gold{background:#CFA72F !important;color:#1E3266 !important}
.logo-ink{display:none !important}
.ban-gold .logo-white{display:none !important}
.ban-gold .logo-ink{display:block !important}
.ban-gold .nav-link{color:rgba(30,50,102,0.82)}
.ban-gold .nav-link:hover,.ban-gold .nav-link.is-active{color:#1E3266}
.ban-gold .nav-link.is-active{box-shadow:inset 0 -2px 0 #1E3266}
.ban-gold .hero-lead{color:#1E3266 !important}
.ban-teal .hero-lead,.ban-coral .hero-lead,.ban-blue .hero-lead{color:#FFFFFF !important}
.ban-gold .btn-accent{background:#2F4A92;color:#FFFFFF}
.ban-gold .btn-accent:hover{background:#1E3266;color:#FFFFFF}
.ban-gold .btn-sec-navy{color:#1E3266;border-color:rgba(30,50,102,0.6)}
.ban-gold .btn-sec-navy:hover{color:#1E3266;border-color:#1E3266}
.ban-gold button[aria-label$="photo"]{color:#1E3266 !important;border-color:rgba(30,50,102,0.45) !important}
.ban-coral .btn-accent{background:#FFFFFF;color:#9C452A}
.ban-coral .btn-accent:hover{background:#FBEEE9;color:#9C452A}
.alt .alt-img .photo{object-position:right center}.alt-rev .alt-img .photo{object-position:left center}
.photo{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px;position:relative}
@media (max-width:1439px){.gutter-arc{display:none}}
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.split,.alt,.alt-rev{grid-template-columns:minmax(0,1fr) !important}.alt-rev .alt-img{order:-1}.hero-split{grid-template-columns:minmax(0,1fr) !important}}
.tile svg{display:block}
@media (max-width:760px){.br-d{display:none}.shell{padding-left:16px;padding-right:16px}.h2{font-size:28px}.h3{font-size:26px}.h1{font-size:36px !important}.grid3,.grid2,.notes{grid-template-columns:minmax(0,1fr) !important}.navlinks{display:none !important}.band{padding-top:48px !important;padding-bottom:48px !important}.arc{display:none}.hero-img{margin:0 -16px}.case-split{grid-template-columns:minmax(0,1fr) !important}.note{transform:none !important;margin-top:0 !important}.deliv-split{grid-template-columns:minmax(0,1fr) !important}.ruler-wrap{overflow-x:auto}}
</style>
<style>
/* Goalkeep mark: its six pieces fly in and assemble as the closing banner scrolls into view (same geometry and timing as the homepage close). */
.gk-mark{position:absolute;left:50%;top:50%;width:150px;height:227.7px;margin:-113.8px 0 0 -75.0px;pointer-events:none;transition:opacity .3s ease,visibility .3s}
.gk-mark>div{position:absolute;inset:0;transform-origin:50% 32.94%}
.gk-mark svg{display:block;width:100%;height:100%}
#contact:has(.slide-in) .gk-mark{opacity:0;visibility:hidden}
@media (max-width:1100px){.gk-mark{position:relative;left:auto;top:auto;margin:0 auto;width:120px;height:182.1px}#contact:has(.slide-in) .gk-mark{display:none}}
</style>
</head>
<body>
<template id="dc-tpl">

<div class="gk" style="overflow-x: clip; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; color: #14131A; background: #FCFCFD; font-size: 17px; line-height: 1.65">

<!-- ============ NAV ============ -->
<header class="on-navy {{bannerCls}}" style="background: #2F4A92; position: relative; z-index: 20">
  <div class="shell" style="display: flex; align-items: center; justify-content: space-between; gap: 32px; padding-top: 14px; padding-bottom: 14px">
    <a href="https://goalkeep.org/" aria-label="Goalkeep home" style="display: inline-flex; align-items: center">
      <img class="logo-white" src="images/d6f20c273a7e4a63cb92d0ebfc07523e.webp" alt="Goalkeep" style="height: 36px; width: auto; display: block"><img class="logo-ink" src="images/52bbd9a37c2166bb5e61a6ecbb2c4c15.webp" alt="Goalkeep" style="height: 36px; width: auto">
    </a>
    <nav aria-label="Main" class="navlinks" style="display: flex; align-items: center; gap: 32px">
      <a class="nav-link" href="#">About us</a>
      <div class="nav-item">
        <a class="nav-link is-active" href="#" aria-haspopup="true">What we do
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </a>
        <div class="dd" style="width: 360px">
          <a href="impact-and-measurement-strategy.html"><span><span class="t">Impact and measurement strategy</span><span class="d">Turn your Theory of Change into a usable framework</span></span></a>
          <a href="data-systems-and-workflows.html"><span><span class="t">Data systems and workflows</span><span class="d">An integrated system that scales with you</span></span></a>
          <a href="dashboards-and-reporting.html"><span><span class="t">Dashboards and reporting</span><span class="d">Use your data to make better decisions</span></span></a>
          <a href="data-adoption-and-capacity-building.html" style="background: #E7F2F0"><span><span class="t">Data adoption and capacity-building</span><span class="d">Build a data-confident workforce</span></span></a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-link" href="#" aria-haspopup="true">Programs
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </a>
        <div class="dd" style="width: 360px">
          <a href="kickstarter.html"><span><span class="t">Kickstarter Program</span><span class="d">A data backbone for early-stage nonprofits</span></span></a>
          <a href="data-literacy-program.html"><span><span class="t">Data Literacy Program</span><span class="d">Scale data best practices within your teams</span></span></a>
        </div>
      </div>
      <a class="nav-link" href="#">Case studies</a>
      <a class="nav-link" href="#">Resources</a>
    </nav>
    <a class="btn" href="#contact" style="background: #FFFFFF; color: #2F4A92">Partner with us</a>
  </div>
</header>

<!-- ============ HERO (copy + photo card) ============ -->
<section class="on-navy {{bannerCls}}" style="background: #2F4A92; color: #FFFFFF; position: relative; overflow: hidden">
  <div class="shell hero-split" style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,520px); gap: 40px; align-items: center; padding-top: 44px; padding-bottom: 60px">
    <div>
      <h1 class="h1" style="font-size: 52px; font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; margin: 0">Build a data-confident<br class="br-d"> workforce <em>across all levels<br class="br-d"> of your organisation.</em></h1>
      <p class="hero-lead" style="font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 50ch; margin: 20px 0 0">We enable practical, role-specific data adoption that helps people use data in their everyday work, so it becomes a habit rather than a one-off event.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 28px">
        <a class="btn btn-accent" href="#contact" onClick="{{openForm}}">Work with us <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
        <a class="btn btn-sec-navy" href="#case">Read Dasra case study</a>
      </div>
    </div>
    <div>
      <div role="region" aria-roledescription="carousel" aria-label="Photos from Goalkeep engagements" style="position: relative; border-radius: 16px; overflow: hidden; height: 400px; box-shadow: 0 18px 40px rgba(20,19,26,0.28)">
        <div style="display: flex; height: 100%; transform: translateX({{slideX}}); transition: transform 700ms cubic-bezier(0.22,1,0.36,1)">
          <img src="images/6616bb19d578b4407abaff9cbb89cc4b.webp" alt="A participant presenting during a data literacy session" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/c7fa18945afc05080e35a4e989719575.webp" alt="A programme session running in a village classroom" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/02adf370ce68ad12d02aaf2eb57276c3.webp" alt="Goalkeep with a partner team after a workshop" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/d9f25a2c090890697a8d9bf1806f663d.webp" alt="A Goalkeep working session on the floor of a partner office" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px">
        <div style="display: flex; gap: 8px; align-items: center">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
            <button type="button" aria-label="{{d.label}}" aria-current="{{d.current}}" onClick="{{d.go}}" style="width: 28px; height: 28px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="display: block; height: 4px; border-radius: 2px; width: {{d.w}}; background: {{d.bg}}; transition: width 240ms, background-color 240ms"></span></button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px">
          <button type="button" aria-label="Previous photo" onClick="{{prevSlide}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next photo" onClick="{{nextSlide}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ SIX SIGNS: sticky-note self-check ============ -->
<section class="band" style="background: #FFFFFF; padding-top: 56px; padding-bottom: 64px; position: relative; z-index: 2">
  <svg class="arc gutter-arc" aria-hidden="true" width="286" height="286" viewBox="0 0 286 286" style="position: absolute; left: -163px; bottom: -143px; pointer-events: none">
    <circle cx="143" cy="143" r="126" fill="none" stroke="#2F9C8F" stroke-width="34"></circle>
  </svg>
  <div class="shell split" style="position: relative; display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 48px; align-items: center">
    <div>
      <h2 class="h2">Six signs your team’s data confidence <em>needs a boost.</em></h2>
      <p style="margin: 16px 0 0; max-width: 40ch">Tap the ones that seem relatable to you.</p>
      <div style="height: 64px; display: flex; align-items: flex-end; visibility: {{ctaVis}}">
        <a class="btn btn-primary" href="#contact" onClick="{{openForm}}">Talk to us about these <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
      </div>
      <div style="margin-top: 40px">
        <div>
          <p style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; max-width: 24ch">{{verdictTitle}}</p>
          <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: rgba(20,19,26,0.72); max-width: 30ch">{{verdictBody}}</p>
        </div>
      </div>
    </div>
    <div class="notes" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding: 8px 0">
      <button type="button" class="note" aria-pressed="{{s0.pressed}}" onClick="{{s0.toggle}}" style="background: {{s0.bg}}; border-radius: {{s0.radius}}; transform: {{s0.transform}}; margin-top: {{s0.offset}}; box-shadow: {{s0.shadow}}; border: 1.5px solid {{s0.border}}">
        <span style="display: flex; justify-content: space-between; align-items: center; height: 36px">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{s0.iconBg}}; color: {{s0.iconFg}}; transition: background-color 320ms, color 320ms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg></span>
        </span>
        <span style="font-weight: {{s0.weight}}">{{s0.text}}</span>
      </button>
      <button type="button" class="note" aria-pressed="{{s1.pressed}}" onClick="{{s1.toggle}}" style="background: {{s1.bg}}; border-radius: {{s1.radius}}; transform: {{s1.transform}}; margin-top: {{s1.offset}}; box-shadow: {{s1.shadow}}; border: 1.5px solid {{s1.border}}">
        <span style="display: flex; justify-content: space-between; align-items: center; height: 36px">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{s1.iconBg}}; color: {{s1.iconFg}}; transition: background-color 320ms, color 320ms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        </span>
        <span style="font-weight: {{s1.weight}}">{{s1.text}}</span>
      </button>
      <button type="button" class="note" aria-pressed="{{s2.pressed}}" onClick="{{s2.toggle}}" style="background: {{s2.bg}}; border-radius: {{s2.radius}}; transform: {{s2.transform}}; margin-top: {{s2.offset}}; box-shadow: {{s2.shadow}}; border: 1.5px solid {{s2.border}}">
        <span style="display: flex; justify-content: space-between; align-items: center; height: 36px">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{s2.iconBg}}; color: {{s2.iconFg}}; transition: background-color 320ms, color 320ms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M17 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg></span>
        </span>
        <span style="font-weight: {{s2.weight}}">{{s2.text}}</span>
      </button>
      <button type="button" class="note" aria-pressed="{{s3.pressed}}" onClick="{{s3.toggle}}" style="background: {{s3.bg}}; border-radius: {{s3.radius}}; transform: {{s3.transform}}; margin-top: {{s3.offset}}; box-shadow: {{s3.shadow}}; border: 1.5px solid {{s3.border}}">
        <span style="display: flex; justify-content: space-between; align-items: center; height: 36px">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{s3.iconBg}}; color: {{s3.iconFg}}; transition: background-color 320ms, color 320ms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></span>
        </span>
        <span style="font-weight: {{s3.weight}}">{{s3.text}}</span>
      </button>

      if (val.indexOf('{{') === -1) return;
      if (/^on[a-z]+$/i.test(name)) {
        node.removeAttribute(name);
        var evt = name.slice(2).toLowerCase();
        var path = exprOf(val);
        var current = { scopes: [] };

        updaters.push(function (scopes) { current.scopes = scopes; });

      var holder = document.createElement('div');
      holder.appendChild(clone);

      var expr = exprOf(el.getAttribute('value'));

          inst.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });

        }
        if (inst) inst.ups.forEach(function (u) { u(scopes); });
      });

      var listExpr = exprOf(el.getAttribute('list'));

          for (var i = 0; i < list.length; i++) {
            var it = instantiate();
            it.nodes.forEach(function (n) { anchor.parentNode.insertBefore(n, anchor); });

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checked: [], formOpen: false, submitted: false, slide: 0 };
  }
  componentDidMount() {
    this._timer = setInterval(() => {
      const cur = (this.state && this.state.slide) || 0;
      this.setState({ slide: (cur + 1) % 4 });
    }, 5000);
  }
  componentWillUnmount() {
    if (this._timer) clearInterval(this._timer);
  }
  goSlide(n) {
    if (this._timer) clearInterval(this._timer);
    this._timer = null;
    this.setState({ slide: (n + 4) % 4 });
  }
  renderVals() {
    const st = this.state || {};
    const slide = st.slide || 0;
    const dots = [0, 1, 2, 3].map((n) => ({
      label: 'Show photo ' + (n + 1) + ' of 4',
      current: n === slide ? 'true' : 'false',
      w: n === slide ? '24px' : '10px',
      bg: n === slide ? '#EAC452' : 'rgba(255,255,255,0.5)',
      go: () => this.goSlide(n)
    }));
    const checked = st.checked || [];
    const texts = [
      'Teams have access to data or dashboards but use them inconsistently.',
      'People lack confidence interpreting, visualising or communicating data.',
      'Data capability varies widely across roles and sits with a few specialists.',
      'Previous training did not change day-to-day practice.',
      'Your organisation needs a shared vocabulary and stronger data-review routines.',
      'You’re supporting a cohort that wants to strengthen their MEL capabilities.'
    ];
                const iconTints = ['#E7F2F0', '#FBF3DF', '#EAEFF9', '#FBEEE9', '#E7F2F0', '#FBF3DF'];
    const iconInks = ['#176059', '#7D5E0C', '#2F4D9F', '#9C452A', '#176059', '#7D5E0C'];
    const baseOf = { '#FBF3DF': '#EAC452', '#EAEFF9': '#3F63C8', '#E7F2F0': '#2F9C8F', '#FBEEE9': '#E07A5F' };
    const onFills = ['#5FC9BA', '#F7DB63', '#8FA8E8', '#F0A58C', '#5FC9BA', '#F7DB63'];
    const onIcons = ['#176059', '#7D5E0C', '#2F4D9F', '#9C452A', '#176059', '#7D5E0C'];
    const onShadows = ['rgba(23,96,89,0.24)', 'rgba(125,94,12,0.24)', 'rgba(47,77,159,0.24)', 'rgba(156,69,42,0.24)', 'rgba(23,96,89,0.24)', 'rgba(125,94,12,0.24)'];
    const out = {};
    texts.forEach((text, i) => {
      const on = checked.indexOf(i) !== -1;
      out['s' + i] = {
        text: text,
        on: on,
        pressed: on ? 'true' : 'false',
        bg: on ? iconTints[i] : '#FFFFFF',
        border: on ? (baseOf[iconTints[i]] || '#E5E7EE') : '#E5E7EE',
        radius: '14px',
        transform: on ? 'translateY(-4px) scale(1.02)' : 'none',
        offset: '0px',
        shadow: on ? '0 16px 32px ' + onShadows[i] : '0 1px 2px rgba(20,19,26,0.06), 0 8px 22px rgba(20,19,26,0.08)',
        iconBg: on ? onIcons[i] : iconTints[i],
        iconFg: on ? '#FFFFFF' : iconInks[i],
        weight: on ? '700' : '400',
        toggle: () => {
          const cur = (this.state && this.state.checked) || [];
          const next = cur.indexOf(i) !== -1 ? cur.filter((x) => x !== i) : cur.concat([i]);
          this.setState({ checked: next });
        }
      };
    });

    const count = checked.length;
    const ringColors = ['#FBEEE9', '#FBF3DF', '#EAEFF9', '#E7F2F0', '#2F4A92', '#EAC452'];
    const ringEdges = ['#E07A5F', '#EAC452', '#3F63C8', '#2F9C8F', '#2F4A92', '#EAC452'];
    for (let k = 0; k < 6; k++) {
      out['g' + k] = { color: ringColors[k], edge: ringEdges[k], off: k < count ? '0' : '100' };
    }

    let verdictTitle = 'Nothing tapped yet.';
    let verdictBody = 'Tap any note that rings true for you.';
    if (count >= 1 && count <= 2) { verdictTitle = 'Worth a conversation.'; verdictBody = 'Small gaps in data confidence tend to widen if left unchecked.'; }
    if (count >= 3) { verdictTitle = 'Your team’s data capability needs serious attention.'; verdictBody = 'This is exactly what we’re here to fix. Let’s connect.'; }

    const weeks = [];
    for (let n = 1; n <= 10; n++) {
      const inRange = n >= 7 && n <= 8;
      weeks.push({ n: n, weight: inRange ? '800' : '600', color: inRange ? '#7D5E0C' : 'rgba(20,19,26,0.6)' });
    }

    const formOpen = !!st.formOpen;
    const submitted = !!st.submitted;
    const themed = (this.props.banner ?? 'theme') !== 'navy';
    return Object.assign(out, {
      bannerCls: themed ? 'ban-teal' : '',
      slideX: (-slide * 100) + '%',
      dots: dots,
      prevSlide: () => this.goSlide(slide - 1),
      nextSlide: () => this.goSlide(slide + 1),
      count: count,
      verdictTitle: verdictTitle,
      verdictBody: verdictBody,
      ctaVis: count >= 2 ? 'visible' : 'hidden',
      weeks: weeks,
      formOpen: formOpen,
      formExpanded: formOpen ? 'true' : 'false',
      submitted: submitted,
      notSubmitted: !submitted,
      openForm: () => { if (!(this.state && this.state.formOpen)) this.setState({ formOpen: true, submitted: false }); },
      closeForm: () => this.setState({ formOpen: false, submitted: false }),
      submitForm: () => this.setState({ submitted: true })
    });
  }
}
DCMount(Component, {"banner": "theme"});

  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

    queued = false;
    var mark = document.querySelector('#contact .gk-mark');
    if (!mark) return;
    var kids = mark.children, i;
    if (reduce && reduce.matches) {
      for (i = 0; i < kids.length; i++) { kids[i].style.transform = ''; kids[i].style.opacity = ''; }
      return;
    }
    var r = mark.getBoundingClientRect(), vh = window.innerHeight;
    if (!r.height) return;
    var endTop = SETTLE * vh - r.height / 2;
    var p = clamp((vh - r.top) / (vh - endTop));
    for (i = 0; i < kids.length && i < P.length; i++) {
      var t = clamp((p - i * 0.088) / 0.38), k = 1 - t, s = P[i];
      var o = t < 0.22 ? t / 0.22 * 0.75 : t < 0.55 ? 0.75 + (t - 0.22) / 0.33 * 0.25 : 1;
      kids[i].style.transform = 'translate(' + (s[0] * SCALE * k).toFixed(2) + 'px,' + (s[1] * SCALE * k).toFixed(2) + 'px) rotate(' + (s[2] * k).toFixed(2) + 'deg)';
      kids[i].style.opacity = o.toFixed(3);
    }
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(update); } }
  addEventListener('scroll', queue, { passive: true });
  addEventListener('resize', queue);
  if (reduce && reduce.addEventListener) reduce.addEventListener('change', queue);
  addEventListener('load', queue);
  queue();
})();
</script>
