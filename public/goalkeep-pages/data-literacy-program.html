.cloud .cb:nth-child(odd){justify-self:start}
.cloud .cb:nth-child(even){justify-self:end}

.cb{position:relative;border:1.5px solid #E5E7EE;border-radius:18px;padding:12px 16px;font-family:inherit;line-height:1.35;text-align:left;cursor:pointer;transition:background-color 420ms,color 420ms,border-color 420ms,box-shadow 420ms,transform 520ms cubic-bezier(0.22,1,0.36,1)}
.cb:focus-visible{outline:3px solid #3F63C8;outline-offset:3px}

.cb-right .cb-tail{right:24px}

@media (max-width:760px){.br-d{display:none}.shell{padding-left:16px;padding-right:16px}.h2{font-size:28px}.h3{font-size:26px}.h1{font-size:36px !important}.grid3,.grid2,.notes{grid-template-columns:minmax(0,1fr) !important}.navlinks{display:none !important}.band{padding-top:48px !important;padding-bottom:48px !important}.arc{display:none}.hero-img{margin:0 -16px}.case-split{grid-template-columns:minmax(0,1fr) !important}.note{transform:none !important;margin-top:0 !important}.deliv-split{grid-template-columns:minmax(0,1fr) !important}.ruler-wrap{overflow-x:auto}}
.flow-top,.flow-fan{stroke-dasharray:100;stroke-dashoffset:100}
.flow-node{opacity:0;transform-box:fill-box;transform-origin:center}
.flow-dot{opacity:0;transform-box:fill-box;transform-origin:center}
.flow-on .flow-top{animation:flowDraw 900ms cubic-bezier(0.45,0,0.55,1) forwards}
.flow-on .flow-node{animation:flowPop 420ms cubic-bezier(0.34,1.56,0.64,1) 880ms forwards}
.flow-on .flow-fan{animation:flowDraw 800ms cubic-bezier(0.22,1,0.36,1) forwards}
.flow-on .flow-dot{animation:flowDot 520ms cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes flowDraw{to{stroke-dashoffset:0}}
@keyframes flowPop{0%{opacity:0;transform:scale(0.4)}100%{opacity:1;transform:scale(1)}}
@keyframes flowDot{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.flow-top,.flow-fan{stroke-dashoffset:0}.flow-node,.flow-dot{opacity:1}.flow-on .flow-top,.flow-on .flow-fan,.flow-on .flow-node,.flow-on .flow-dot{animation:none}}
.flow-btn{display:inline-flex;align-items:center;gap:14px;max-width:320px;text-align:left;font-family:inherit;font-size:16px;font-weight:700;line-height:1.35;color:#176059;background:#FFFFFF;border:1.5px solid #2F9C8F;border-radius:999px;padding:10px 22px 10px 10px;cursor:pointer;box-shadow:0 10px 24px rgba(23,96,89,0.16);transition:transform 240ms cubic-bezier(0.22,1,0.36,1),box-shadow 240ms,background-color 240ms,color 240ms}
.flow-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(23,96,89,0.22);background:#2F9C8F;color:#FFFFFF}
.flow-btn:focus-visible{outline:3px solid #3F63C8;outline-offset:3px}
.flow-btn-ic{position:relative;width:40px;height:40px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;background:#2F9C8F;color:#FFFFFF;transition:background-color 240ms,color 240ms}
.flow-btn:hover .flow-btn-ic{background:#FFFFFF;color:#2F9C8F}
.flow-btn-ic::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid #2F9C8F;opacity:0;animation:flowRing 2.2s ease-out infinite}
@keyframes flowRing{0%{opacity:0.55;transform:scale(0.85)}70%,100%{opacity:0;transform:scale(1.35)}}
.slide-up{animation:slideUp 420ms cubic-bezier(0.22,1,0.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.flow-btn-ic::after,.slide-up{animation:none}}
.stat{display:flex;flex-direction:column;gap:6px;padding:28px 28px 30px}

.portrait{width:132px;height:132px;border-radius:999px;object-fit:cover;display:block;border:5px solid #FFFFFF;box-shadow:0 10px 26px rgba(20,19,26,0.16)}
.ovl{position:absolute;background:#FFFFFF;border-radius:16px;box-shadow:0 22px 48px rgba(20,19,26,0.22);padding:14px 16px}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;background:transparent;border:none;font-family:inherit;font-size:19px;font-weight:700;line-height:1.4;color:#14131A;cursor:pointer;padding:20px 0}
.faq-q:focus-visible{outline:3px solid #3F63C8;outline-offset:2px;border-radius:6px}
.strike{position:relative;display:inline-block;font-size:15px;font-weight:700;padding:6px 12px;border-radius:999px;background:#FFFFFF;color:rgba(20,19,26,0.6);border:1px solid #E5E7EE}

</style>

<!-- ============ HERO (copy + photo card) ============ -->
<section class="on-navy" style="background: #2F4A92; color: #FFFFFF; position: relative; overflow: hidden">
  <div class="shell hero-split" style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,520px); gap: 40px; align-items: center; padding-top: 76px; padding-bottom: 60px">
    <div>
      <h1 class="h1" style="font-size: 52px; font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; margin: 0">Build a data-confident<br class="br-d"> workforce <em>within your<br class="br-d"> organisation.</em></h1>
      <p style="font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 50ch; margin: 20px 0 0">The Data Literacy Program is Goalkeep’s train-the-trainer program for strengthening data capability across social-purpose organisations. Over a 3-day workshop, participants build foundational skills in interpreting, analysing, visualising and communicating with data, so they can run trainings within their own organisation.</p>
      <p style="margin: 24px 0 0"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 4px; background: rgba(255,255,255,0.12); color: #FFFFFF"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Data Literacy Program · next cohort begins December 2026</span></p>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px">
        <a class="btn btn-accent" href="#contact" onClick="{{openForm}}">Register your interest <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
        <a class="btn btn-sec-navy" href="#contact" onClick="{{openForm}}">Partner with us to support a cohort</a>
      </div>
    </div>
    <div>
      <div role="region" aria-roledescription="carousel" aria-label="Photos from the Data Literacy Program" style="position: relative; border-radius: 16px; overflow: hidden; height: 400px; box-shadow: 0 18px 40px rgba(20,19,26,0.28)">

        <button type="button" class="stage-tab" role="tab" aria-selected="{{t0.sel}}" onClick="{{st0.pick}}" style="background: {{t0.bg}}; border-color: {{t0.border}}; box-shadow: {{t0.shadow}}">

          <span style="font-size: 16px; font-weight: 800; line-height: 1.25; color: #14131A">Data<br> communication</span>

    <div aria-hidden="true" style="height: 4px; background: #F1F4FA; border-radius: 2px; margin: 12px 0 28px; overflow: hidden"><div style="height: 100%; width: {{progressW}}; background: {{progressC}}; border-radius: 2px; transition: width 520ms cubic-bezier(0.22,1,0.36,1), background-color 320ms"></div></div>
      <sc-if value="{{show0}}" hint-placeholder-val="{{ true }}">
        <div class="panel slide-in" role="tabpanel" style="display: grid; grid-template-columns: minmax(0,6fr) minmax(0,5fr); gap: 64px; align-items: center">
          <div style="position: relative">
            <img src="images/4916e36c67501b53a47e423d7b67c14c.webp" alt="A participant working through numbers on a laptop" style="width: 100%; height: 420px; object-fit: cover; object-position: 50% 50%; display: block; border-radius: 20px">
          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #7D5E0C">Skill 1 of 5</p>

            <p style="margin: 28px 0 0"><button type="button" class="tlink" onClick="{{st1.pick}}" style="background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; font-family: inherit; color: #2F4D9F">Next: Qualitative data analysis <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button></p>

      <sc-if value="{{show1}}" hint-placeholder-val="{{ false }}">

          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #2F4D9F">Skill 2 of 5</p>

            <p style="margin: 14px 0 0; font-size: 21px; line-height: 1.5; max-width: 40ch">Organise and interpret feedback, interviews, observations and other forms of qualitative evidence.</p>
            <p style="margin: 28px 0 0"><button type="button" class="tlink" onClick="{{st2.pick}}" style="background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; font-family: inherit; color: #176059">Next: Data interpretation <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button></p>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{show2}}" hint-placeholder-val="{{ false }}">
        <div class="panel slide-in" role="tabpanel" style="display: grid; grid-template-columns: minmax(0,6fr) minmax(0,5fr); gap: 64px; align-items: center">
          <div style="position: relative">
            <img src="images/649817726f784680ee90eb7c16871388.webp" alt="A facilitator walking the room through a dashboard on screen" style="width: 100%; height: 420px; object-fit: cover; object-position: 50% 35%; display: block; border-radius: 20px">
          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #176059">Skill 3 of 5</p>
            <h3 class="h3" style="margin-top: 8px">Data interpretation</h3>
            <p style="margin: 14px 0 0; font-size: 21px; line-height: 1.5; max-width: 40ch">Read charts, indicators and dashboards carefully, and identify what the evidence does and does not support.</p>
            <p style="margin: 28px 0 0"><button type="button" class="tlink" onClick="{{st3.pick}}" style="background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; font-family: inherit; color: #9C452A">Next: Data visualisation <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button></p>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{show3}}" hint-placeholder-val="{{ false }}">
        <div class="panel slide-in" role="tabpanel" style="display: grid; grid-template-columns: minmax(0,6fr) minmax(0,5fr); gap: 64px; align-items: center">

          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #9C452A">Skill 4 of 5</p>
            <h3 class="h3" style="margin-top: 8px">Data visualisation</h3>
            <p style="margin: 14px 0 0; font-size: 21px; line-height: 1.5; max-width: 40ch">Choose and design visual representations that make information easier to understand.</p>
            <p style="margin: 28px 0 0"><button type="button" class="tlink" onClick="{{st4.pick}}" style="background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; font-family: inherit; color: #2F4A92">Next: Data communication <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button></p>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{show4}}" hint-placeholder-val="{{ false }}">
        <div class="panel slide-in" role="tabpanel" style="display: grid; grid-template-columns: minmax(0,6fr) minmax(0,5fr); gap: 64px; align-items: center">
          <div style="position: relative">
            <img src="images/ed52f378e4af65827a829b08d65042e4.webp" alt="A participant presenting her group’s findings to the cohort" style="width: 100%; height: 420px; object-fit: cover; object-position: 50% 30%; display: block; border-radius: 20px">
          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #2F4A92">Skill 5 of 5</p>
            <h3 class="h3" style="margin-top: 8px">Data communication</h3>
            <p style="margin: 14px 0 0; font-size: 21px; line-height: 1.5; max-width: 40ch">Translate evidence into clear messages and narratives for colleagues, partners and funders.</p>
            <p style="margin: 28px 0 0"><a class="btn btn-primary" href="#contact" onClick="{{openForm}}">Register your interest <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></p>
          </div>
        </div>
      </sc-if>
  </div>
</section>

<!-- ============ HOW AI IS INTEGRATED ============ -->
<section class="band" style="background: #EAEFF9; padding-top: 48px; padding-bottom: 52px">
  <div class="shell ai-grid" style="display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 48px; align-items: center">
    <div>
      <p class="eyebrow">how ai is integrated into the program</p>
      <h2 class="h2" style="max-width: 24ch">Data literacy remains the core capability. <em>AI is only an assistive layer.</em></h2>
      <p style="margin: 14px 0 0; max-width: 60ch">Participants learn to use everyday AI tools responsibly, keeping foundational data skills, verification and human judgement at the centre. Every skill follows the same three steps.</p>
      <div class="ai-steps" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 28px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: #7D5E0C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></svg></span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.3">Build the underlying capability</span>
          <span style="font-size: 14px; line-height: 1.5; color: rgba(20,19,26,0.75)">Learn what good interpretation, analysis, visualisation and communication look like.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: #2F4D9F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><path d="m12 8 1.5 2.5L16 12l-2.5 1.5L12 16l-1.5-2.5L8 12l2.5-1.5z"></path></svg></span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.3">Use AI to strengthen the work</span>
          <span style="font-size: 14px; line-height: 1.5; color: rgba(20,19,26,0.75)">Use accessible AI tools to organise information, start an analysis or communicate faster.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: #176059; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.3">Verify through human judgement</span>
          <span style="font-size: 14px; line-height: 1.5; color: rgba(20,19,26,0.75)">Check AI outputs against the evidence, context and purpose before using them.</span>
        </div>
      </div>
    </div>
    <div style="position: relative">
      <img src="images/7dc8597c98c55b84b13e9dd587f05f4d.webp" alt="Participants working on laptops around a training table" style="width: 100%; height: 230px; object-fit: cover; object-position: 40% 50%; display: block; border-radius: 18px; box-shadow: 0 14px 34px rgba(20,19,26,0.14)">
      <img src="images/9fbc340e521b1cf818eae13ffc11cea5.webp" alt="Anand and a participant working through an analysis together on a laptop" style="width: 64%; height: 190px; object-fit: cover; object-position: 50% 40%; display: block; border-radius: 16px; border: 5px solid #EAEFF9; box-shadow: 0 14px 32px rgba(20,19,26,0.18); margin: -56px 0 0 auto; position: relative">
    </div>
  </div>
</section>

      <div style="display: flex; gap: 14px; align-items: flex-start"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 28 28" style="flex: none; margin-top: 2px"><path d="M 5 15 Q 9 18 11.5 22 Q 16 11 24 5" fill="none" stroke="#F6D83A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span><span style="display: block; font-size: 20px; font-weight: 700; line-height: 1.3">Stronger organisational routines</span><span style="display: block; margin-top: 6px; font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.84)">Data interpretation becomes part of recurring programme reviews, leadership conversations, and reporting and decision-making.</span></span></div>

<!-- ============ FAQ ============ -->
<section class="band" style="background: #F7F5EF; padding-top: 48px; padding-bottom: 56px">
  <div class="shell faq-grid" style="display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 64px; align-items: start">
    <div>
      <p class="eyebrow" style="color: #176059">frequently asked questions</p>
      <h2 class="h2">Questions organisations <em>ask before they nominate.</em></h2>
      <img src="images/c1c60b43105a3feca541a7e04eec05a8.webp" alt="A facilitator answering a question at a table during the immersive" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 40%; display: block; border-radius: 16px; margin-top: 32px">

<script>
/* dc-lite: a tiny standalone renderer for the Goalkeep page templates.
   Reads markup from <template id="dc-tpl">, fills {{bindings}}, handles <sc-if>, <sc-for>
   and onClick / onMouseEnter handlers, and re-renders on setState. No dependencies. */
(function () {
  var RE = /\{\{([^}]+)\}\}/g;
  function lookup(scopes, path) {
    path = path.trim();
    var parts = path.split('.');
    var obj;
    for (var i = scopes.length - 1; i >= 0; i--) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) { obj = scopes[i]; break; }
    }
    if (!obj) return undefined;
    var v = obj;
    for (var k = 0; k < parts.length; k++) { if (v == null) return undefined; v = v[parts[k]]; }
    return v;
  }
  function interp(str, scopes) {
    return str.replace(RE, function (m, p) { var v = lookup(scopes, p); return v == null ? '' : String(v); });
  }
  function exprOf(attr) { var m = /\{\{([^}]+)\}\}/.exec(attr || ''); return m ? m[1] : ''; }

  function compileNodes(nodes, updaters) {
    for (var i = 0; i < nodes.length; i++) compileNode(nodes[i], updaters);
  }
  function compileNode(node, updaters) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) {
        var tpl = node.nodeValue;
        updaters.push(function (scopes) { var t = interp(tpl, scopes); if (node.nodeValue !== t) node.nodeValue = t; });
      }
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-if' || tag === 'sc-for') { compileBlock(node, tag, updaters); return; }
    var attrs = Array.prototype.slice.call(node.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-placeholder') === 0) { node.removeAttribute(name); return; }
      if (val.indexOf('{{') === -1) return;
      if (/^on[a-z]+$/i.test(name)) {
        node.removeAttribute(name);
        var evt = name.slice(2).toLowerCase();
        var path = exprOf(val);
        var current = { scopes: [] };
        node.addEventListener(evt, function (e) { var fn = lookup(current.scopes, path); if (typeof fn === 'function') fn(e); });
        updaters.push(function (scopes) { current.scopes = scopes; });
        return;
      }
      node.setAttribute(name, '');
      updaters.push(function (scopes) { var t = interp(val, scopes); if (node.getAttribute(name) !== t) node.setAttribute(name, t); });
    });
    compileNodes(Array.prototype.slice.call(node.childNodes), updaters);
  }
  function compileBlock(el, tag, updaters) {
    var anchor = document.createComment(tag);
    el.parentNode.replaceChild(anchor, el);
    var frag = document.createDocumentFragment();
    while (el.firstChild) frag.appendChild(el.firstChild);
    function instantiate() {
      var clone = frag.cloneNode(true);
      var nodes = Array.prototype.slice.call(clone.childNodes);
      var ups = [];
      var holder = document.createElement('div');
      holder.appendChild(clone);
      compileNodes(Array.prototype.slice.call(holder.childNodes), ups);
      nodes = Array.prototype.slice.call(holder.childNodes);
      return { nodes: nodes, ups: ups };
    }
    if (tag === 'sc-if') {
      var expr = exprOf(el.getAttribute('value'));
      var inst = null;
      updaters.push(function (scopes) {
        var on = !!lookup(scopes, expr);
        if (on && !inst) {
          inst = instantiate();
          inst.nodes.forEach(function (n) { anchor.parentNode.insertBefore(n, anchor); });
        } else if (!on && inst) {
          inst.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
          inst = null;
        }
        if (inst) inst.ups.forEach(function (u) { u(scopes); });
      });
    } else {
      var listExpr = exprOf(el.getAttribute('list'));
      var as = el.getAttribute('as') || 'item';
      var items = [];
      updaters.push(function (scopes) {
        var list = lookup(scopes, listExpr) || [];
        if (list.length !== items.length) {
          items.forEach(function (it) { it.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); }); });
          items = [];
          for (var i = 0; i < list.length; i++) {
            var it = instantiate();
            it.nodes.forEach(function (n) { anchor.parentNode.insertBefore(n, anchor); });
            items.push(it);
          }
        }
        items.forEach(function (it, i) {
          var s = {}; s[as] = list[i];
          var sc = scopes.concat([s]);
          it.ups.forEach(function (u) { u(sc); });
        });
      });
    }
  }

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (patch) {
    this.state = Object.assign({}, this.state || {}, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.renderVals = function () { return {}; };
  window.DCLogic = DCLogic;

  window.DCMount = function (Component, props) {
    var tpl = document.getElementById('dc-tpl');
    var root = document.getElementById('dc-root');
    root.appendChild(tpl.content.cloneNode(true));
    var updaters = [];
    compileNodes(Array.prototype.slice.call(root.childNodes), updaters);
    var comp = new Component(props || {});
    if (!comp.state) comp.state = {};
    var queued = false;
    function render() {
      queued = false;
      var vals = comp.renderVals() || {};
      updaters.forEach(function (u) { u([vals]); });
    }

    render();

    window.addEventListener('pagehide', function () { if (comp.componentWillUnmount) comp.componentWillUnmount(); });
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { formOpen: false, submitted: false, slide: 0, step: 0, lit: 0, faq: 0, flowOn: false };
  }
  componentDidMount() {
    this._timer = setInterval(() => {
      const cur = (this.state && this.state.slide) || 0;
      this.setState({ slide: (cur + 1) % 4 });
    }, 5000);
    this._stepTimer = setInterval(() => {
      const cur = (this.state && this.state.step) || 0;
      this.setState({ step: (cur + 1) % 5 });
    }, 8000);
    this._litTimer = setInterval(() => {
      const cur = (this.state && this.state.lit) || 0;
      this.setState({ lit: (cur + 1) % 7 });
    }, 1900);
  }
  componentWillUnmount() {
    if (this._flowT) clearTimeout(this._flowT);
    if (this._replayT) clearTimeout(this._replayT);
    if (this._io) this._io.disconnect();
    if (this._timer) clearInterval(this._timer);
    if (this._stepTimer) clearInterval(this._stepTimer);
    if (this._litTimer) clearInterval(this._litTimer);
  }
  goSlide(n) {
    if (this._timer) clearInterval(this._timer);
    this._timer = null;
    this.setState({ slide: (n + 4) % 4 });
  }
  goLit(n) {
    if (this._litTimer) clearInterval(this._litTimer);
    this._litTimer = null;
    if (((this.state && this.state.lit) || 0) !== n) this.setState({ lit: n });
  }
  goStep(n) {
    if (this._stepTimer) clearInterval(this._stepTimer);
    this._stepTimer = null;
    if (((this.state && this.state.step) || 0) !== n) this.setState({ step: n });
  }
  renderVals() {
    const st = this.state || {};
    const slide = st.slide || 0;
    const step = st.step || 0;
    const dots = [0, 1, 2, 3].map((n) => ({
      label: 'Show photo ' + (n + 1) + ' of 4',
      current: n === slide ? 'true' : 'false',
      w: n === slide ? '24px' : '10px',
      bg: n === slide ? '#EAC452' : 'rgba(255,255,255,0.5)',
      go: () => this.goSlide(n)
    }));
    const base = ['#EAC452', '#3F63C8', '#2F9C8F', '#E07A5F', '#2F4A92'];
    const tints = ['#FBF3DF', '#EAEFF9', '#E7F2F0', '#FBEEE9', '#EAEFF9'];
    const out = {};
    for (let k = 0; k < 5; k++) {
      const on = k === step;
      const done = k < step;
      out['t' + k] = {
        sel: on ? 'true' : 'false',
        bg: on ? tints[k] : '#FFFFFF',
        border: on ? base[k] : '#E5E7EE',
        shadow: on ? '0 10px 24px rgba(20,19,26,0.08)' : 'none',
        numBg: on || done ? base[k] : '#F1F4FA',
        numFg: on || done ? '#FFFFFF' : 'rgba(20,19,26,0.6)'
      };
      out['st' + k] = { pick: () => this.goStep(k) };
      out['show' + k] = on;
    }
    const lit = st.lit || 0;
    const cTint = ['#E7F2F0', '#FBF3DF', '#EAEFF9', '#FBEEE9', '#E7F2F0', '#FBF3DF', '#EAEFF9'];
    const cBase = ['#2F9C8F', '#EAC452', '#3F63C8', '#E07A5F', '#2F9C8F', '#EAC452', '#3F63C8'];
    const cShadow = ['rgba(23,96,89,0.20)', 'rgba(125,94,12,0.20)', 'rgba(47,77,159,0.20)', 'rgba(156,69,42,0.20)', 'rgba(23,96,89,0.20)', 'rgba(125,94,12,0.20)', 'rgba(47,77,159,0.20)'];
    for (let k = 0; k < 7; k++) {
      const on = k === lit;
      out['c' + k] = {
        pressed: on ? 'true' : 'false',
        bg: on ? cTint[k] : '#FFFFFF',
        border: on ? cBase[k] : '#E5E7EE',
        shadow: on ? '0 12px 26px ' + cShadow[k] : 'none',
        fg: on ? '#14131A' : 'rgba(20,19,26,0.72)',
        weight: on ? '700' : '400',
        shift: on ? '8px' : '0px',
        dotBg: on ? cBase[k] : '#FFFFFF',
        dotBorder: on ? cBase[k] : '#D3D7E2',
        tick: on ? '#FFFFFF' : '#D3D7E2',
        pick: () => this.goLit(k)
      };
    }
    const faq = (st.faq === undefined) ? 0 : st.faq;
    for (let k = 0; k < 6; k++) {
      const open = k === faq;
      out['f' + k] = {
        open: open,
        expanded: open ? 'true' : 'false',
        rot: open ? '45deg' : '0deg',
        iconBg: open ? '#2F9C8F' : '#E7F2F0',
        iconFg: open ? '#FFFFFF' : '#176059',
        toggle: () => this.setState({ faq: (((this.state && this.state.faq) === k) ? -1 : k) })
      };
    }
    const formOpen = !!st.formOpen;
    const submitted = !!st.submitted;
    return Object.assign(out, {
      flowCls: st.flowOn ? 'flow-on' : '',
      flowIdle: !st.flowOn,
      flowOn: !!st.flowOn,
      startFlow: () => { if (!(this.state && this.state.flowOn)) this.setState({ flowOn: true }); },
      slideX: (-slide * 100) + '%',
      dots: dots,
      prevSlide: () => this.goSlide(slide - 1),
      nextSlide: () => this.goSlide(slide + 1),
      progressW: ((step + 1) * 20) + '%',
      progressC: base[step],
      formOpen: formOpen,
      formExpanded: formOpen ? 'true' : 'false',
      submitted: submitted,
      notSubmitted: !submitted,
      openForm: () => { if (!(this.state && this.state.formOpen)) this.setState({ formOpen: true, submitted: false }); },
      closeForm: () => this.setState({ formOpen: false, submitted: false }),
      submitForm: () => this.setState({ submitted: true })
    });
  }
}
DCMount(Component, {});
</script>
<script>
/* Scroll-linked assembly of the Goalkeep mark in the closing banner. Each piece owns an
   overlapping slice of the scroll so they land one at a time. Reduced motion: drawn finished. */
(function () {
  var P = [[0.65,-150.00,-120],[110.88,-40.36,140],[105.21,123.19,-95],[-73.34,109.75,128],[-138.46,-46.33,-145],[0.00,175.00,105]], SCALE = 0.53191, SETTLE = 0.6;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var queued = false;
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function update() {
    queued = false;
    var mark = document.querySelector('#contact .gk-mark');
    if (!mark) return;
    var kids = mark.children, i;
    if (reduce && reduce.matches) {
      for (i = 0; i < kids.length; i++) { kids[i].style.transform = ''; kids[i].style.opacity = ''; }
      return;
    }
    var r = mark.getBoundingClientRect(), vh = window.innerHeight;
    if (!r.height) return;
    var endTop = SETTLE * vh - r.height / 2;
    var p = clamp((vh - r.top) / (vh - endTop));
    for (i = 0; i < kids.length && i < P.length; i++) {
      var t = clamp((p - i * 0.088) / 0.38), k = 1 - t, s = P[i];
      var o = t < 0.22 ? t / 0.22 * 0.75 : t < 0.55 ? 0.75 + (t - 0.22) / 0.33 * 0.25 : 1;
      kids[i].style.transform = 'translate(' + (s[0] * SCALE * k).toFixed(2) + 'px,' + (s[1] * SCALE * k).toFixed(2) + 'px) rotate(' + (s[2] * k).toFixed(2) + 'deg)';
      kids[i].style.opacity = o.toFixed(3);
    }
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(update); } }
  addEventListener('scroll', queue, { passive: true });
  addEventListener('resize', queue);
  if (reduce && reduce.addEventListener) reduce.addEventListener('change', queue);
  addEventListener('load', queue);
  queue();
})();
</script>
