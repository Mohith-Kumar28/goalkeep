<style>
body{margin:0;background:#FCFCFD}
a{color:#2F4D9F}a:hover{color:#1E3266}
.gk *{box-sizing:border-box}
.gk em{font-style:italic;font-weight:800}
.shell{max-width:1320px;margin:0 auto;padding-left:64px;padding-right:64px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#2F4D9F;margin:0 0 16px}
.eyebrow::before{content:"";width:24px;height:2px;background:currentColor;display:block}
.on-navy .eyebrow{color:#EAC452}
.eyebrow.gold-ink{color:#7D5E0C}
.h2{font-size:42px;font-weight:400;line-height:1.16;letter-spacing:-0.02em;margin:0;text-wrap:balance;max-width:24ch}
.h3{font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-0.015em;margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:15px;font-weight:700;padding:11px 20px;border-radius:4px;text-decoration:none;border:1px solid transparent;min-height:44px;cursor:pointer;transition:background-color 240ms cubic-bezier(0.22,1,0.36,1),border-color 240ms,color 240ms}
.btn svg{transition:transform 240ms cubic-bezier(0.22,1,0.36,1)}
.btn:hover svg{transform:translateX(3px)}
.btn-accent{background:#EAC452;color:#1E3266}.btn-accent:hover{background:#CFA72F;color:#1E3266}
.on-navy .btn-accent:hover{background:#FFFFFF}
.btn-sec-navy{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,0.6)}.btn-sec-navy:hover{color:#FFFFFF;border-color:#FFFFFF}
.btn-primary{background:#2F4A92;color:#FFFFFF}.btn-maroon{background:#9C452A;color:#FFFFFF}.btn-maroon:hover{background:#7A3420;color:#FFFFFF}.btn-primary:hover{background:#1E3266;color:#FFFFFF}
.tlink{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#2F4D9F;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px;transition:gap 140ms}
.tlink:hover{gap:12px;color:#1E3266}
.nav-item{position:relative}
.nav-link{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.86);text-decoration:none;font-size:15px;font-weight:600;padding:12px 0;min-height:44px}
.nav-link:hover,.nav-link.is-active{color:#FFFFFF}
.nav-link.is-active{box-shadow:inset 0 -2px 0 #EAC452}
.dd{display:none;position:absolute;top:100%;left:-24px;width:400px;background:#FFFFFF;border:1px solid #E5E7EE;border-radius:12px;box-shadow:0 16px 40px rgba(20,19,26,0.18);padding:8px;z-index:30}
.nav-item:hover .dd,.nav-item:focus-within .dd{display:block}
.dd a{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:8px;text-decoration:none;color:#14131A}
.dd a:hover{background:#F1F4FA;color:#14131A}
.dd .sw{width:10px;height:10px;border-radius:2px;margin-top:6px;flex:none}
.dd .t{font-size:15px;font-weight:700;display:block}
.dd .d{font-size:13px;color:rgba(20,19,26,0.72);display:block;margin-top:2px;line-height:1.45}
.surface{background:#FFFFFF;border:1px solid #E5E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(20,19,26,0.06)}
.lift{transition:transform 240ms cubic-bezier(0.22,1,0.36,1),box-shadow 240ms,border-color 240ms}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,19,26,0.12);border-color:#D3D7E2}
.marker{background:linear-gradient(100deg,#F7DB63 0%,#FCF0A5 5%,#FCF0A5 95%,#F7DB63 100%);padding:0 5px;margin:0 -2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:2px}
.note{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;padding:22px 22px 20px;font-family:inherit;font-size:16px;line-height:1.5;color:#14131A;cursor:pointer;border:none;transition:transform 320ms cubic-bezier(0.22,1,0.36,1),box-shadow 320ms,background-color 320ms}
.note:hover{box-shadow:0 18px 36px rgba(125,94,12,0.22) !important}
.note:focus-visible{outline:3px solid #3F63C8;outline-offset:3px}
.deliv{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font-family:inherit;font-size:17px;line-height:1.45;color:#14131A;padding:16px 18px;border:none;border-radius:10px;cursor:pointer;transition:background-color 240ms}
.deliv:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
.sign{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:28px 30px 30px;background:transparent;border:none;font-family:inherit;font-size:19px;line-height:1.5;color:#14131A;cursor:pointer;border-radius:12px;transition:background-color 240ms}
.sign:hover{background:#FBF3DF}
.sign:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
.sign .loop{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);pointer-events:none;overflow:visible}
.field{font-family:inherit;font-size:17px;font-weight:400;padding:11px 14px;border:1px solid #D3D7E2;border-radius:8px;color:#14131A;background:#FFFFFF;min-height:44px}
.field:focus{outline:3px solid rgba(63,99,200,0.35);border-color:#3F63C8}
.slide-in{animation:slidein 420ms cubic-bezier(0.22,1,0.36,1)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide-in{animation:none}}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;border:none;font-family:inherit;cursor:pointer;padding:6px 4px;color:#14131A;position:relative;z-index:1}
.step:focus-visible{outline:3px solid #3F63C8;outline-offset:3px;border-radius:8px}
.step-dot{width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background-color 320ms,color 320ms,box-shadow 320ms,transform 320ms cubic-bezier(0.22,1,0.36,1)}
.step:hover .step-dot{transform:translateY(-2px)}
.glance-item{display:flex;gap:14px;align-items:flex-start;padding:22px 24px}
.story{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:#14131A}
@media (max-width:1100px){.steps-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important;row-gap:16px}.steps-line{display:none}.panel{grid-template-columns:minmax(0,1fr) !important}.glance{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
@media (max-width:760px){.glance,.stories,.outcomes,.change{grid-template-columns:minmax(0,1fr) !important}.change-arrow{transform:rotate(90deg)}}
.pair-cap{position:absolute;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;padding:6px 10px;border-radius:4px;background:#FFFFFF;color:#14131A;box-shadow:0 4px 14px rgba(20,19,26,0.14)}
.chat{background:#F1F4FA;border-radius:20px;padding:0 0 22px;box-shadow:0 24px 56px rgba(20,19,26,0.10);overflow:hidden}
.msg{opacity:0;transform:translateY(14px) scale(0.98)}
.msg.in{animation:msgin 560ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes msgin{to{opacity:1;transform:none}}
.bubble{background:#FFFFFF;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:16px;line-height:1.45;box-shadow:0 1px 2px rgba(20,19,26,0.06);max-width:440px}
.ring-arc{cursor:pointer;transition:stroke-width 420ms cubic-bezier(0.22,1,0.36,1),stroke 320ms,opacity 320ms}
.acc{display:block;width:100%;text-align:left;background:transparent;border:none;font-family:inherit;color:#14131A;cursor:pointer;padding:16px 20px;border-radius:12px}
.acc:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.msg{opacity:1;transform:none}.msg.in{animation:none}}
@media (max-width:1100px){.how-grid{grid-template-columns:minmax(0,1fr) !important}.pair{margin-bottom:40px}}
.cloud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:16px;align-items:center;padding:6px 0 18px;margin-left:-24px}
.cloud .cb:nth-child(odd){justify-self:start}
.cloud .cb:nth-child(even){justify-self:end}
@media (max-width:760px){.cloud{grid-template-columns:minmax(0,1fr);margin-left:0}.cloud .cb{justify-self:stretch !important}}
.cb{position:relative;border:1.5px solid #E5E7EE;border-radius:18px;padding:12px 16px;font-family:inherit;line-height:1.35;text-align:left;cursor:pointer;transition:background-color 420ms,color 420ms,border-color 420ms,box-shadow 420ms,transform 520ms cubic-bezier(0.22,1,0.36,1)}
.cb:focus-visible{outline:3px solid #3F63C8;outline-offset:3px}
.cb-tail{position:absolute;bottom:-7px;width:13px;height:13px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg);border-radius:0 0 3px 0;transition:background-color 420ms,border-color 420ms}
.cb-left .cb-tail{left:24px}
.cb-right .cb-tail{right:24px}
.stage-tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #E5E7EE;border-radius:12px;font-family:inherit;cursor:pointer;text-align:left;min-height:60px;transition:background-color 320ms,border-color 320ms,box-shadow 320ms}
.stage-tab:focus-visible{outline:3px solid #3F63C8;outline-offset:2px}
@media (max-width:760px){.cb{transform:none !important;margin-top:0 !important;max-width:none !important}.stage-tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
.photo{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px;position:relative}
@media (max-width:1439px){.gutter-arc{display:none}}
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.split,.alt,.alt-rev{grid-template-columns:minmax(0,1fr) !important}.alt-rev .alt-img{order:-1}.hero-split{grid-template-columns:minmax(0,1fr) !important}}
.tile svg{display:block}
@media (max-width:760px){.br-d{display:none}.shell{padding-left:16px;padding-right:16px}.h2{font-size:28px}.h3{font-size:26px}.h1{font-size:36px !important}.grid3,.grid2,.notes{grid-template-columns:minmax(0,1fr) !important}.navlinks{display:none !important}.band{padding-top:48px !important;padding-bottom:48px !important}.arc{display:none}.hero-img{margin:0 -16px}.case-split{grid-template-columns:minmax(0,1fr) !important}.note{transform:none !important;margin-top:0 !important}.deliv-split{grid-template-columns:minmax(0,1fr) !important}.ruler-wrap{overflow-x:auto}}
</style>
<style>
/* Goalkeep mark: its six pieces fly in and assemble as the closing banner scrolls into view (same geometry and timing as the homepage close). */
.gk-mark{position:absolute;left:50%;top:50%;width:150px;height:227.7px;margin:-113.8px 0 0 -75.0px;pointer-events:none;transition:opacity .3s ease,visibility .3s}
.gk-mark>div{position:absolute;inset:0;transform-origin:50% 32.94%}
.gk-mark svg{display:block;width:100%;height:100%}
#contact:has(.slide-in) .gk-mark{opacity:0;visibility:hidden}
@media (max-width:1100px){.gk-mark{position:relative;left:auto;top:auto;margin:0 auto;width:120px;height:182.1px}#contact:has(.slide-in) .gk-mark{display:none}}
</style>

<!-- ============ HERO (copy + photo card) ============ -->
<section class="on-navy" style="background: #2F4A92; color: #FFFFFF; position: relative; overflow: hidden">
  <div class="shell hero-split" style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,520px); gap: 40px; align-items: center; padding-top: 44px; padding-bottom: 60px">
    <div>
      <h1 class="h1" style="font-size: 52px; font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; margin: 0">Build the data backbone<br class="br-d"> <em>your organisation<br class="br-d"> needs to grow.</em></h1>
      <p style="font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 50ch; margin: 20px 0 0">Kickstarter is Goalkeep’s hands-on program for early-stage nonprofits that want to move from scattered information and manual reporting to a simple, integrated data system their teams can use.</p>
      <p style="margin: 24px 0 0"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 4px; background: rgba(255,255,255,0.12); color: #FFFFFF"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Kickstarter 3.0 · next cohort begins January 2027</span></p>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px">
        <a class="btn btn-accent" href="#contact" onClick="{{openForm}}">Apply for Kickstarter 3.0 <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
        <a class="btn btn-sec-navy" href="#contact" onClick="{{openForm}}">Partner with us to support a cohort</a>
      </div>
    </div>
    <div>
      <div role="region" aria-roledescription="carousel" aria-label="Photos from Goalkeep engagements" style="position: relative; border-radius: 16px; overflow: hidden; height: 400px; box-shadow: 0 18px 40px rgba(20,19,26,0.28)">
        <div style="display: flex; height: 100%; transform: translateX({{slideX}}); transition: transform 700ms cubic-bezier(0.22,1,0.36,1)">
          <img src="images/d9f25a2c090890697a8d9bf1806f663d.webp" alt="A Goalkeep working session on the floor of a partner office" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/3c1c275e978a7bbdbc2b4a398c8494ac.webp" alt="A partner team around a meeting-room table during a working session" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/46fd758db6cd80183d9d4f676d744baa.webp" alt="Two partner team members working through data on a laptop" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
          <img src="images/d7e0a2f562f148853d7f839e7a34590d.webp" alt="Goalkeep with a partner team after a workshop" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block">
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px">
        <div style="display: flex; gap: 8px; align-items: center">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
            <button type="button" aria-label="{{d.label}}" aria-current="{{d.current}}" onClick="{{d.go}}" style="width: 28px; height: 28px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="display: block; height: 4px; border-radius: 2px; width: {{d.w}}; background: {{d.bg}}; transition: width 240ms, background-color 240ms"></span></button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px">

        </div>
      </div>
    </div>
  </div>
</section>

      <span><span style="display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: rgb(125, 94, 12)">Who it’s for</span><span style="display: block; font-size: 16px; line-height: 1.45; margin-top: 4px; color: rgb(20, 19, 26)">Early-stage nonprofits ready to move beyond messy spreadsheets</span></span>

    <p style="margin: 48px 0 0; font-size: 19px; font-weight: 700">A well-used Kickstarter system can help your organisation:</p>

<script>
/* dc-lite: a tiny standalone renderer for the Goalkeep page templates.
   Reads markup from <template id="dc-tpl">, fills {{bindings}}, handles <sc-if>, <sc-for>
   and onClick / onMouseEnter handlers, and re-renders on setState. No dependencies. */
(function () {
  var RE = /\{\{([^}]+)\}\}/g;
  function lookup(scopes, path) {
    path = path.trim();
    var parts = path.split('.');
    var obj;
    for (var i = scopes.length - 1; i >= 0; i--) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) { obj = scopes[i]; break; }
    }
    if (!obj) return undefined;
    var v = obj;
    for (var k = 0; k < parts.length; k++) { if (v == null) return undefined; v = v[parts[k]]; }
    return v;
  }
  function interp(str, scopes) {
    return str.replace(RE, function (m, p) { var v = lookup(scopes, p); return v == null ? '' : String(v); });
  }
  function exprOf(attr) { var m = /\{\{([^}]+)\}\}/.exec(attr || ''); return m ? m[1] : ''; }

  function compileNodes(nodes, updaters) {
    for (var i = 0; i < nodes.length; i++) compileNode(nodes[i], updaters);
  }
  function compileNode(node, updaters) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) {
        var tpl = node.nodeValue;
        updaters.push(function (scopes) { var t = interp(tpl, scopes); if (node.nodeValue !== t) node.nodeValue = t; });
      }
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-if' || tag === 'sc-for') { compileBlock(node, tag, updaters); return; }
    var attrs = Array.prototype.slice.call(node.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-placeholder') === 0) { node.removeAttribute(name); return; }
      if (val.indexOf('{{') === -1) return;
      if (/^on[a-z]+$/i.test(name)) {
        node.removeAttribute(name);
        var evt = name.slice(2).toLowerCase();
        var path = exprOf(val);
        var current = { scopes: [] };
        node.addEventListener(evt, function (e) { var fn = lookup(current.scopes, path); if (typeof fn === 'function') fn(e); });
        updaters.push(function (scopes) { current.scopes = scopes; });
        return;
      }
      node.setAttribute(name, '');
      updaters.push(function (scopes) { var t = interp(val, scopes); if (node.getAttribute(name) !== t) node.setAttribute(name, t); });
    });
    compileNodes(Array.prototype.slice.call(node.childNodes), updaters);
  }
  function compileBlock(el, tag, updaters) {
    var anchor = document.createComment(tag);
    el.parentNode.replaceChild(anchor, el);
    var frag = document.createDocumentFragment();
    while (el.firstChild) frag.appendChild(el.firstChild);
    function instantiate() {
      var clone = frag.cloneNode(true);
      var nodes = Array.prototype.slice.call(clone.childNodes);
      var ups = [];
      var holder = document.createElement('div');
      holder.appendChild(clone);
      compileNodes(Array.prototype.slice.call(holder.childNodes), ups);
      nodes = Array.prototype.slice.call(holder.childNodes);
      return { nodes: nodes, ups: ups };
    }
    if (tag === 'sc-if') {
      var expr = exprOf(el.getAttribute('value'));
      var inst = null;
      updaters.push(function (scopes) {
        var on = !!lookup(scopes, expr);
        if (on && !inst) {
          inst = instantiate();
          inst.nodes.forEach(function (n) { anchor.parentNode.insertBefore(n, anchor); });
        } else if (!on && inst) {
          inst.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
          inst = null;
        }
        if (inst) inst.ups.forEach(function (u) { u(scopes); });
      });
    } else {
      var listExpr = exprOf(el.getAttribute('list'));
      var as = el.getAttribute('as') || 'item';
      var items = [];
      updaters.push(function (scopes) {
        var list = lookup(scopes, listExpr) || [];
        if (list.length !== items.length) {
          items.forEach(function (it) { it.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); }); });
          items = [];
          for (var i = 0; i < list.length; i++) {
            var it = instantiate();
            it.nodes.forEach(function (n) { anchor.parentNode.insertBefore(n, anchor); });
            items.push(it);
          }
        }
        items.forEach(function (it, i) {
          var s = {}; s[as] = list[i];

    var tpl = document.getElementById('dc-tpl');
    var root = document.getElementById('dc-root');
    root.appendChild(tpl.content.cloneNode(true));
    var updaters = [];

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { formOpen: false, submitted: false, slide: 0, step: 0, lit: 0 };
  }
  componentDidMount() {
    this._timer = setInterval(() => {
      const cur = (this.state && this.state.slide) || 0;
      this.setState({ slide: (cur + 1) % 4 });
    }, 5000);
    this._stepTimer = setInterval(() => {
      const cur = (this.state && this.state.step) || 0;
      this.setState({ step: (cur + 1) % 4 });
    }, 8000);
    this._litTimer = setInterval(() => {
      const cur = (this.state && this.state.lit) || 0;
      this.setState({ lit: (cur + 1) % 10 });
    }, 1900);
  }
  componentWillUnmount() {
    if (this._timer) clearInterval(this._timer);
    if (this._stepTimer) clearInterval(this._stepTimer);
    if (this._litTimer) clearInterval(this._litTimer);
  }
  goSlide(n) {
    if (this._timer) clearInterval(this._timer);
    this._timer = null;
    this.setState({ slide: (n + 4) % 4 });
  }
  goLit(n) {
    if (this._litTimer) clearInterval(this._litTimer);
    this._litTimer = null;
    if (((this.state && this.state.lit) || 0) !== n) this.setState({ lit: n });
  }
  goStep(n) {
    if (this._stepTimer) clearInterval(this._stepTimer);
    this._stepTimer = null;
    if (((this.state && this.state.step) || 0) !== n) this.setState({ step: n });
  }
  renderVals() {
    const st = this.state || {};
    const slide = st.slide || 0;
    const step = st.step || 0;
    const dots = [0, 1, 2, 3].map((n) => ({
      label: 'Show photo ' + (n + 1) + ' of 4',
      current: n === slide ? 'true' : 'false',
      w: n === slide ? '24px' : '10px',
      bg: n === slide ? '#EAC452' : 'rgba(255,255,255,0.5)',
      go: () => this.goSlide(n)
    }));
    const names = ['Understand', 'Design', 'Build', 'Adopt'];
    const base = ['#EAC452', '#3F63C8', '#2F9C8F', '#E07A5F'];
    const tints = ['#FBF3DF', '#EAEFF9', '#E7F2F0', '#FBEEE9'];
    const lift = ['#F7DB63', '#8FA8E8', '#5FC9BA', '#F0A58C'];
    const out = {};
    for (let k = 0; k < 4; k++) {
      const on = k === step;
      const done = k < step;
      out['t' + k] = {
        sel: on ? 'true' : 'false',
        bg: on ? tints[k] : '#FFFFFF',
        border: on ? base[k] : '#E5E7EE',
        shadow: on ? '0 10px 24px rgba(20,19,26,0.08)' : 'none',
        numBg: on || done ? base[k] : '#F1F4FA',
        numFg: on || done ? '#FFFFFF' : 'rgba(20,19,26,0.6)'
      };
      out['st' + k] = { pick: () => this.goStep(k) };
      out['show' + k] = on;
    }
    const lit = st.lit || 0;
    const bTint = ['#FBF3DF', '#EAEFF9', '#E7F2F0', '#FBEEE9', '#EAEFF9', '#FBF3DF', '#FBEEE9', '#E7F2F0', '#FBF3DF', '#EAEFF9'];
    const bInk = ['#7D5E0C', '#2F4D9F', '#176059', '#9C452A', '#2F4D9F', '#7D5E0C', '#9C452A', '#176059', '#7D5E0C', '#2F4D9F'];
    const bBase = ['#EAC452', '#3F63C8', '#2F9C8F', '#E07A5F', '#3F63C8', '#EAC452', '#E07A5F', '#2F9C8F', '#EAC452', '#3F63C8'];
    const bShadow = ['rgba(125,94,12,0.24)', 'rgba(47,77,159,0.24)', 'rgba(23,96,89,0.24)', 'rgba(156,69,42,0.24)', 'rgba(47,77,159,0.24)', 'rgba(125,94,12,0.24)', 'rgba(156,69,42,0.24)', 'rgba(23,96,89,0.24)', 'rgba(125,94,12,0.24)', 'rgba(47,77,159,0.24)'];
    for (let k = 0; k < 10; k++) {
      const on = k === lit;
      out['b' + k] = {
        pressed: on ? 'true' : 'false',
        bg: on ? bTint[k] : '#FFFFFF',
        fg: on ? '#14131A' : 'rgba(20,19,26,0.62)',
        border: on ? bBase[k] : '#E5E7EE',
        shadow: on ? '0 14px 28px ' + bShadow[k] : '0 2px 6px rgba(20,19,26,0.05)',
        scale: on ? '1.06' : '1',
        weight: on ? '700' : '400',
        pick: () => this.goLit(k)
      };
    }
    const formOpen = !!st.formOpen;
    const submitted = !!st.submitted;
    return Object.assign(out, {
      slideX: (-slide * 100) + '%',
      dots: dots,
      prevSlide: () => this.goSlide(slide - 1),
      nextSlide: () => this.goSlide(slide + 1),
      activeName: names[step],
      progressW: ((step + 1) * 25) + '%',
      progressC: base[step],
      activeNum: step + 1,
      formOpen: formOpen,
      formExpanded: formOpen ? 'true' : 'false',
      submitted: submitted,
      notSubmitted: !submitted,
      openForm: () => { if (!(this.state && this.state.formOpen)) this.setState({ formOpen: true, submitted: false }); },
      closeForm: () => this.setState({ formOpen: false, submitted: false }),
      submitForm: () => this.setState({ submitted: true })
    });
  }
}

<script>
/* Scroll-linked assembly of the Goalkeep mark in the closing banner. Each piece owns an
   overlapping slice of the scroll so they land one at a time. Reduced motion: drawn finished. */
(function () {
  var P = [[0.65,-150.00,-120],[110.88,-40.36,140],[105.21,123.19,-95],[-73.34,109.75,128],[-138.46,-46.33,-145],[0.00,175.00,105]], SCALE = 0.53191, SETTLE = 0.6;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var queued = false;
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function update() {
    queued = false;
    var mark = document.querySelector('#contact .gk-mark');
    if (!mark) return;
    var kids = mark.children, i;
    if (reduce && reduce.matches) {
      for (i = 0; i < kids.length; i++) { kids[i].style.transform = ''; kids[i].style.opacity = ''; }
      return;
    }
    var r = mark.getBoundingClientRect(), vh = window.innerHeight;
    if (!r.height) return;
    var endTop = SETTLE * vh - r.height / 2;
    var p = clamp((vh - r.top) / (vh - endTop));
    for (i = 0; i < kids.length && i < P.length; i++) {
      var t = clamp((p - i * 0.088) / 0.38), k = 1 - t, s = P[i];
      var o = t < 0.22 ? t / 0.22 * 0.75 : t < 0.55 ? 0.75 + (t - 0.22) / 0.33 * 0.25 : 1;
      kids[i].style.transform = 'translate(' + (s[0] * SCALE * k).toFixed(2) + 'px,' + (s[1] * SCALE * k).toFixed(2) + 'px) rotate(' + (s[2] * k).toFixed(2) + 'deg)';
      kids[i].style.opacity = o.toFixed(3);
    }
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(update); } }
  addEventListener('scroll', queue, { passive: true });
  addEventListener('resize', queue);
  if (reduce && reduce.addEventListener) reduce.addEventListener('change', queue);
  addEventListener('load', queue);
  queue();
})();
</script>
