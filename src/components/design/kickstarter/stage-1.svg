<svg role="img" aria-label="Illustration: a board of the questions a programme team needs its data to answer, with one priority question picked" width="100%" viewBox="0 0 560 400" style="display: block; border-radius: 20px; background: #FBF3DF"><defs><filter id="cs" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14131A" flood-opacity="0.10"></feDropShadow></filter></defs><rect x="28" y="40" width="504" height="320" rx="16" fill="#FFFFFF" filter="url(#cs)"></rect><text x="52" y="80" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12" font-weight="800" fill="#7D5E0C">WHAT DO WE NEED OUR DATA TO ANSWER?</text><path d="M 52 94 H 508" stroke="#E5E7EE" stroke-width="1.5"></path><g transform="rotate(-3 120 178)"><rect x="50" y="118" width="146" height="120" rx="6" fill="#FCF0A5" stroke="#EAC452" stroke-width="1.5" filter="url(#cs)"></rect><text x="64" y="152" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">Which children are</text><text x="64" y="170" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">falling behind?</text><rect x="64" y="192" width="90" height="6" rx="4" fill="#F7DB63"></rect><rect x="64" y="206" width="64" height="6" rx="4" fill="#F7DB63"></rect></g><g transform="rotate(2 278 168)"><rect x="208" y="108" width="146" height="120" rx="6" fill="#FFFFFF" stroke="#E5E7EE" stroke-width="1.5" filter="url(#cs)"></rect><text x="222" y="142" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">Where are volunteers</text><text x="222" y="160" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">needed next month?</text><rect x="222" y="182" width="90" height="6" rx="4" fill="#E5E7EE"></rect><rect x="222" y="196" width="64" height="6" rx="4" fill="#E5E7EE"></rect></g><g transform="rotate(-2 436 180)"><rect x="366" y="120" width="146" height="120" rx="6" fill="#FFFFFF" stroke="#E5E7EE" stroke-width="1.5" filter="url(#cs)"></rect><text x="380" y="154" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">What should funders</text><text x="380" y="172" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12.5" font-weight="700" fill="#14131A">see each quarter?</text><rect x="380" y="194" width="90" height="6" rx="4" fill="#E5E7EE"></rect><rect x="380" y="208" width="64" height="6" rx="4" fill="#E5E7EE"></rect></g><circle cx="190" cy="122" r="15" fill="#2F4A92"></circle><path d="M 183 122 l 5 5 l 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 52 280 H 508" stroke="#E5E7EE" stroke-width="1.5"></path><text x="52" y="308" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="11" font-weight="800" fill="#7D5E0C">PRIORITY QUESTION</text><text x="52" y="332" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="15" font-weight="700" fill="#14131A">Which children are falling behind, and how early can we tell?</text></svg>