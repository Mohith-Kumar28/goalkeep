<svg role="img" aria-label="Illustration: a board of the questions a programme team needs its data to answer, with one priority question picked" width="100%" viewBox="0 0 340 500" style="display: block; border-radius: 20px; background: #FBF3DF"><defs><filter id="cs-m" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14131A" flood-opacity="0.10"></feDropShadow></filter></defs><rect x="16" y="16" width="308" height="468" rx="16" fill="#FFFFFF" filter="url(#cs-m)"></rect><text x="36" y="48" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="13" font-weight="800" fill="#7D5E0C">WHAT DO WE NEED OUR DATA</text><text x="36" y="66" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="13" font-weight="800" fill="#7D5E0C">TO ANSWER?</text><path d="M 36 82 H 304" stroke="#E5E7EE" stroke-width="1.5"></path><g transform="rotate(-2 144 145)"><rect x="34" y="104" width="220" height="82" rx="6" fill="#FCF0A5" stroke="#EAC452" stroke-width="1.5" filter="url(#cs-m)"></rect><text x="50" y="132" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">Which children are</text><text x="50" y="151" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">falling behind?</text><rect x="50" y="162" width="96" height="6" rx="4" fill="#F7DB63"></rect><rect x="150" y="162" width="64" height="6" rx="4" fill="#F7DB63"></rect></g><g transform="rotate(2 194 241)"><rect x="84" y="200" width="220" height="82" rx="6" fill="#FFFFFF" stroke="#E5E7EE" stroke-width="1.5" filter="url(#cs-m)"></rect><text x="100" y="228" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">Where are volunteers</text><text x="100" y="247" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">needed next month?</text><rect x="100" y="258" width="96" height="6" rx="4" fill="#E5E7EE"></rect><rect x="200" y="258" width="64" height="6" rx="4" fill="#E5E7EE"></rect></g><g transform="rotate(-1.5 154 337)"><rect x="44" y="296" width="220" height="82" rx="6" fill="#FFFFFF" stroke="#E5E7EE" stroke-width="1.5" filter="url(#cs-m)"></rect><text x="60" y="324" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">What should funders</text><text x="60" y="343" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="14" font-weight="700" fill="#14131A">see each quarter?</text><rect x="60" y="354" width="96" height="6" rx="4" fill="#E5E7EE"></rect><rect x="160" y="354" width="64" height="6" rx="4" fill="#E5E7EE"></rect></g><circle cx="246" cy="108" r="15" fill="#2F4A92"></circle><path d="M 239 108 l 5 5 l 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 36 402 H 304" stroke="#E5E7EE" stroke-width="1.5"></path><text x="36" y="428" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="12" font-weight="800" fill="#7D5E0C">PRIORITY QUESTION</text><text x="36" y="452" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="16" font-weight="700" fill="#14131A">Which children are falling behind,</text><text x="36" y="472" text-anchor="start" font-family="Nunito Sans, sans-serif" font-size="16" font-weight="700" fill="#14131A">and how early can we tell?</text></svg>